[project]
name = "polymarket-strategies"
version = "0.5.0"
description = "All 35 indexed strategy tools and a reader-controlled Polymarket trading toolkit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jason Hikaru" }]
requires-python = ">=3.11"
dependencies = [
    "polymarket-client==0.12.0",
    "eth-account>=0.13.7",  # imported directly by the trading toolkit; the SDK also needs it
]

[project.urls]
Repository = "https://github.com/jasonhikaru8/polymarket_strategies"

[project.scripts]
polymarket-strategies = "polymarket_strategies.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
